services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-development-key-change-before-deploying}
      DATABASE_URL: sqlite:////data/centro_estudiantes.db
    volumes:
      - centro_estudiantes_data:/data
    restart: unless-stopped

volumes:
  centro_estudiantes_data:
