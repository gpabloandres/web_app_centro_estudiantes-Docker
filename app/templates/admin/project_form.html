{% extends "base.html" %}
{% block title %}{{ 'Editar' if project else 'Nuevo' }} proyecto | Administración{% endblock %}
{% block content %}
<header class="page-heading"><span class="eyebrow">Administración · Proyectos</span><h1>{{ 'Editar proyecto' if project else 'Nuevo proyecto' }}</h1></header>
<form class="form-panel" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="title">Título</label><input id="title" name="title" maxlength="150" value="{{ project.title if project else '' }}" required><label for="description">Descripción</label><textarea id="description" name="description" rows="8" maxlength="20000" required>{{ project.description if project else '' }}</textarea><div class="form-row"><div><label for="status">Estado</label><select id="status" name="status">{% for option in ['En propuesta','En ejecución','Finalizado'] %}<option{% if project and project.status == option %} selected{% endif %}>{{ option }}</option>{% endfor %}</select></div><div><label for="category">Categoría</label><input id="category" name="category" maxlength="50" value="{{ project.category if project else 'General' }}"></div></div><div class="form-actions"><a class="button button-quiet" href="{{ url_for('admin.projects') }}">Cancelar</a><button class="button button-dark" type="submit">Guardar proyecto</button></div></form>
{% endblock %}
