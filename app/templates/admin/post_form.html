{% extends "base.html" %}
{% block title %}{{ 'Editar' if post else 'Nueva' }} publicación | Administración{% endblock %}
{% block content %}
<header class="page-heading"><span class="eyebrow">Administración · Publicaciones</span><h1>{{ 'Editar publicación' if post else 'Nueva publicación' }}</h1></header>
<form class="form-panel" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="title">Título</label><input id="title" name="title" maxlength="150" value="{{ post.title if post else '' }}" required><label for="content">Contenido</label><textarea id="content" name="content" rows="9" maxlength="20000" required>{{ post.content if post else '' }}</textarea><div class="form-row"><div><label for="category">Categoría</label><input id="category" name="category" maxlength="50" value="{{ post.category if post else 'Noticia' }}" required></div><div><label for="image_url">URL de imagen <span class="label-optional">opcional</span></label><input id="image_url" name="image_url" type="url" maxlength="500" value="{{ post.image_url if post and post.image_url else '' }}"></div></div><label class="check-label"><input type="checkbox" name="is_priority"{% if post and post.is_priority %} checked{% endif %}> Marcar como destacada</label><div class="form-actions"><a class="button button-quiet" href="{{ url_for('admin.posts') }}">Cancelar</a><button class="button button-dark" type="submit">Guardar publicación</button></div></form>
{% endblock %}
